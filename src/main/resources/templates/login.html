<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Login - StackBerry</title>
    <th:block layout:fragment="page-css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
              crossorigin="anonymous">

        <style>
            .form-container {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: calc(100vh - 180px);
                padding: 30px 16px;
            }

            .login-card {
                width: 100%;
                max-width: 440px;
                border-radius: var(--radius-xl);
                background: #FFFFFF;
                border: 1px solid var(--border-light);
                box-shadow: var(--shadow-md);
                padding: 36px 30px;
            }

            .login-card h2 {
                font-size: 1.8rem;
                font-weight: 700;
                margin-bottom: 6px;
                text-align: center;
                color: var(--text-title);
            }

            .login-card p.subtitle {
                text-align: center;
                color: var(--text-muted);
                font-size: 0.95rem;
                margin-bottom: 24px;
            }

            .form-label {
                font-weight: 600;
                font-size: 0.88rem;
                color: var(--text-body);
                margin-bottom: 6px;
            }

            .form-control {
                background: #FFFFFF;
                border: 1.5px solid var(--border-medium);
                border-radius: var(--radius-md);
                color: var(--text-title);
                padding: 11px 14px;
                font-size: 0.95rem;
                transition: var(--transition);
            }

            .form-control:focus {
                background: #FFFFFF;
                border-color: var(--primary-berry);
                color: var(--text-title);
                box-shadow: 0 0 0 3px rgba(107, 33, 168, 0.12);
            }

            .btn-login-submit {
                width: 100%;
                padding: 13px;
                font-size: 1rem;
                margin-top: 10px;
                margin-bottom: 18px;
            }

            .form-footer {
                font-size: 0.9rem;
                text-align: center;
                color: var(--text-muted);
                border-top: 1px solid var(--border-light);
                padding-top: 16px;
            }

            .form-footer a {
                color: var(--primary-berry);
                text-decoration: none;
                font-weight: 600;
            }

            .form-footer a:hover {
                text-decoration: underline;
            }
        </style>
    </th:block>
</head>

<body>

<main layout:fragment="content">
    <div class="form-container">
        <div class="login-card">
            <h2>Bem-vindo de volta!</h2>
            <p class="subtitle">Acesse sua conta para fazer seus pedidos</p>

            <!-- Mensagens -->
            <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                Usuário ou senha inválidos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                Você saiu com sucesso.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="username" name="username" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-default btn-login-submit">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar
                </button>
            </form>

            <div class="form-footer">
                <p class="mb-0">Ainda não tem conta? <a th:href="@{/cadastrar}">Cadastre-se</a></p>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="page-script">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
</th:block>

</body>
</html>
