<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">StackBerry</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/styles/styles.css}">
    <link rel="stylesheet" th:href="@{/styles/header.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/site.webmanifest}">

    <th:block layout:fragment="page-css"></th:block>
</head>
<body>

<header>
    <nav id="navbar">
        <a href="/cardapio">
            <img src="/images/StackBerry_Text.png" alt="StackBerry Logo">
        </a>
        <ul id="nav_list">
            <li class="nav-item active"><a href="/cardapio">Cardápio</a></li>

            <li class="nav-item" th:if="${usuario != null and usuario.tipoDeUsuario.name() == 'ADMINISTRADOR'}">
                <a th:href="@{/admin/dashboard_admin}">Dashboard</a>
            </li>

            <li class="nav-item" th:if="${usuario != null and usuario.tipoDeUsuario.name() == 'CLIENTE'}">
                <a th:href="@{/meus-pedidos}">Meus Pedidos</a>
            </li>
        </ul>

        <div class="navbar-buttons">
            <a class="btn-default" href="/carrinho" style="position: relative;">
                <i class="fa-solid fa-bag-shopping"></i> Sacola
                <span th:if="${session.carrinho != null and session.carrinho.totalItens > 0}" 
                      th:text="${session.carrinho.totalItens}" 
                      style="position: absolute; top: -7px; right: -7px; background: #66023C; color: #FFFFFF; font-size: 0.72rem; font-weight: 800; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF;">
                </span>
            </a>

            <a class="btn-outline-glass" th:if="${usuario != null}" href="/logout">
                <i class="fa-solid fa-right-from-bracket"></i> Sair
            </a>

            <a class="btn-purple" th:if="${usuario == null}" href="/login">
                <i class="fa-solid fa-user"></i> Fazer login
            </a>
        </div>

        <button id="mobile_btn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    </nav>
    <div id="mobile_menu">
        <ul id="mobile_nav_list">
            <li class="nav-item"><a href="/cardapio">Cardápio</a></li>

            <li class="nav-item" th:if="${usuario != null and usuario.tipoDeUsuario.name() == 'ADMINISTRADOR'}">
                <a th:href="@{/admin/dashboard_admin}">Dashboard</a>
            </li>

            <li class="nav-item" th:if="${usuario != null and usuario.tipoDeUsuario.name() == 'CLIENTE'}">
                <a th:href="@{/meus-pedidos}">Meus Pedidos</a>
            </li>
        </ul>

        <div class="navbar-buttons" style="display: flex; gap: 10px; margin-top: 10px;">
            <a class="btn-default" href="/carrinho">
                <i class="fa-solid fa-cart-shopping"></i> Carrinho
            </a>

            <a class="btn-outline-glass" th:if="${usuario != null}" href="/logout">
                Sair
            </a>

            <a class="btn-purple" th:if="${usuario == null}" href="/login">
                Fazer login
            </a>
        </div>
    </div>
</header>

<main layout:fragment="content"></main>

<footer id="footer">
    <p>StackBerry &copy; 2026 • Do Stack de Tecnologia à Tigela de Açaí</p>
</footer>

<th:block layout:fragment="page-script"></th:block>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://unpkg.com/scrollreveal"></script>
<script src="/js/script.js"></script>
</body>
</html>
