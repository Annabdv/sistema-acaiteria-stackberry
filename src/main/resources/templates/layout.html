<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">StackBerry</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/styles/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/site.webmanifest}">

    <th:block layout:fragment="page-css"></th:block>
</head>
<body class="pos-body">

<div class="pos-app-wrapper">
    <div class="pos-app-window">
        
        <!-- SIDEBAR LATERAL ESQUERDA (Inspirado no Purr'Coffee) -->
        <aside class="pos-sidebar">
            <div class="pos-brand">
                <a href="/cardapio" class="pos-brand-link">
                    <div class="pos-brand-logo">
                        <i class="fa-solid fa-bowl-food"></i>
                    </div>
                    <div class="pos-brand-name">
                        <strong class="brand-title">StackBerry</strong>
                        <span class="brand-sub">Açaiteria Artesanal</span>
                    </div>
                </a>
            </div>

            <nav class="pos-nav-menu" id="pos-nav-menu">
                <a href="/cardapio" class="pos-nav-link" id="nav-cardapio">
                    <i class="fa-solid fa-utensils"></i>
                    <span>Cardápio</span>
                </a>

                <a href="/carrinho" class="pos-nav-link" id="nav-carrinho">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>Sacola</span>
                    <span class="pos-nav-pill-badge" th:if="${session.carrinho != null and session.carrinho.totalItens > 0}" th:text="${session.carrinho.totalItens}">1</span>
                </a>

                <a href="/meus-pedidos" class="pos-nav-link" id="nav-pedidos" th:if="${usuario != null and usuario.tipoDeUsuario.name() == 'CLIENTE'}">
                    <i class="fa-regular fa-bookmark"></i>
                    <span>Meus Pedidos</span>
                </a>

                <a th:href="@{/admin/dashboard_admin}" class="pos-nav-link" id="nav-admin" th:if="${usuario != null and usuario.tipoDeUsuario.name() == 'ADMINISTRADOR'}">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
            </nav>

            <div class="pos-sidebar-footer">
                <div class="pos-user-card" th:if="${usuario != null}">
                    <div class="user-avatar">
                        <i class="fa-regular fa-user"></i>
                    </div>
                    <div class="user-details">
                        <strong th:text="${usuario.nome}">Cliente</strong>
                        <span th:text="${usuario.email}">cliente@email.com</span>
                    </div>
                    <a href="/logout" class="btn-logout-icon" title="Sair">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </a>
                </div>

                <a href="/login" class="pos-nav-link login-link" th:if="${usuario == null}">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span>Fazer Login</span>
                </a>
            </div>
        </aside>

        <!-- ÁREA DE CONTEÚDO PRINCIPAL (CATÁLOGO + CARRINHO) -->
        <div class="pos-main-viewport">
            <main layout:fragment="content"></main>
        </div>

    </div>
</div>

<th:block layout:fragment="page-script"></th:block>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="/js/script.js"></script>
<script>
    (function() {
        const path = window.location.pathname;
        if (path.includes('/carrinho')) {
            const el = document.getElementById('nav-carrinho');
            if (el) el.classList.add('active');
        } else if (path.includes('/meus-pedidos')) {
            const el = document.getElementById('nav-pedidos');
            if (el) el.classList.add('active');
        } else if (path.includes('/admin')) {
            const el = document.getElementById('nav-admin');
            if (el) el.classList.add('active');
        } else {
            const el = document.getElementById('nav-cardapio');
            if (el) el.classList.add('active');
        }
    })();
</script>
</body>
</html>
