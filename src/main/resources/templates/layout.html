<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/header.css">
    <link rel="stylesheet" href="/home.css">
    <link rel="stylesheet" href="/menu.css">

    <title th:text="${pageTitle}">StackBerry</title>
</head>
<body>
<!-- cabeçalho e navbar -->
<header>
    <nav id="navbar">
        <i class="fa-brands fa-raspberry-pi"> stack berry</i>

        <ul id="nav_list">
            <li class="nav-item active"><a href="/" th:href="@{/}">Home</a></li>
            <li class="nav-item"><a href="#signup" th:href="@{/cadastro}">Cadastro</a></li>
            <li class="nav-item"><a href="#login" th:href="@{/login}">Login</a></li>
        </ul>

        <button class="btn-default">Faça seu pedido aqui!</button>

        <button id="mobile_btn">
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>

    <div id="mobile_menu">
        <ul id="mobile_nav_list">
            <li class="nav-item"><a href="/" th:href="@{/}">Home</a></li>
            <li class="nav-item"><a href="#signup" th:href="@{/cadastro}">Cadastro</a></li>
            <li class="nav-item"><a href="#login" th:href="@{/login}">Login</a></li>
        </ul>
        <button class="btn-default">Faça seu pedido aqui</button>
    </div>
</header>

<main id="content" th:fragment="content">
    <!-- aqui cada página insere seu conteúdo -->
</main>

<!-- rodapé -->
<footer id="footer">
    <div class="container">
        <p>&copy; 2025 StackBerry. Todos os direitos reservados.</p>
    </div>
</footer>
</body>
</html>
