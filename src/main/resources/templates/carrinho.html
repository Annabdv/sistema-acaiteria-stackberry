<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Carrinho</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous"/>
    <style>
        body {
            background-color: rebeccapurple;
            color: white;
        }
        .btn-purple {
            background-color: white;
            color: rebeccapurple;
            border: none;
        }
        .btn-purple:hover {
            background-color: #fff3;
        }
    </style>
</head>
<body>
<main layout:fragment="content">
    <div class="container py-5">
        <h2 class="mb-4">Seu Carrinho</h2>

        <div th:if="${#lists.isEmpty(carrinho.itensNoCarrinho)}">
            <p>Seu carrinho está vazio.</p>
            <a href="/cardapio" class="btn btn-outline-light">Voltar ao Cardápio</a>
        </div>

        <div th:unless="${#lists.isEmpty(carrinho.itensNoCarrinho)}">
            <table class="table table-dark table-striped align-middle">
                <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço Unitário</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${carrinho.itensNoCarrinho}">
                    <td>
                        <strong th:text="${item.acai.tamanho.nome}">Tamanho</strong>
                        <ul class="mb-0">
                            <li th:each="ad : ${item.acai.adicionais}"
                                th:text="${ad.nome + ' (' + #numbers.formatCurrency(ad.preco) + ')'}"></li>
                        </ul>
                    </td>
                    <td>
                        <form th:action="@{/carrinho/atualizar}" method="post" class="d-flex gap-2 align-items-center">
                            <input type="hidden" name="itemId" th:value="${item.id}"/>
                            <input type="number" min="1" name="quantidade" th:value="${item.quantidade}" class="form-control" style="width: 70px;"/>
                            <button type="submit" class="btn btn-purple btn-sm">Atualizar</button>
                        </form>
                    </td>
                    <td th:text="${#numbers.formatCurrency(item.precoUnitario)}">R$ 0,00</td>
                    <td th:text="${#numbers.formatCurrency(item.subTotal())}">R$ 0,00</td>
                    <td>
                        <form th:action="@{/carrinho/remover}" method="post">
                            <input type="hidden" name="itemId" th:value="${item.id}"/>
                            <button type="submit" class="btn btn-danger btn-sm">Remover</button>
                        </form>
                    </td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <th colspan="3" class="text-end">Total:</th>
                    <th th:text="${#numbers.formatCurrency(carrinho.total)}">R$ 0,00</th>
                    <th></th>
                </tr>
                </tfoot>
            </table>
            <a href="/cardapio" class="btn btn-outline-light">Continuar Comprando</a>
            <form th:action="@{/carrinho/finalizarCompra}" method="post">
                <button type="submit" class="btn btn-outline-light">Finalizar Compra</button>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
