<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>Adicionar Novo Adicional</title>
    <th:block layout:fragment="page-css">
        <link rel="stylesheet" th:href="@{/styles/formulario.css}">
    </th:block>
</head>
<body>

<section layout:fragment="content">
    <div class="form-wrapper">
        <h1>Adicionar Novo Adicional</h1>

        <form th:action="@{/admin/adicionais/salvar}" method="post">
            <div class="form-group">
                <label for="nome">Nome do Adicional:</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex: Morango" required>
            </div>

            <div class="form-group">
                <label for="preco">Preço:</label>
                <input type="number" class="form-control" id="preco" name="preco" step="0.01" placeholder="Ex: 3.50" required>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/dashboard_admin}" class="btn-cancel">Cancelar</a>
                <button type="submit" class="btn-default">Salvar Adicional</button>
            </div>
        </form>
    </div>
</section>

</body>
</html>
