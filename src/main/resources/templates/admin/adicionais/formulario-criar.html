<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>Adicionar Novo Adicional</title>
</head>
<body>

<section layout:fragment="content">
    <div class="container">
        <h1>Adicionar Novo Adicional</h1>

        <form th:action="@{/admin/adicionais/salvar}" method="post">
            <div>
                <label for="nome">Nome do Adicional:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <br>
            <div>
                <label for="preco">Preço:</label>
                <input type="number" id="preco" name="preco" step="0.01" required>
            </div>
            <br>
            <button type="submit" class="btn-default">Salvar Adicional</button>
            <a th:href="@{/admin/adicionais}">Cancelar</a>
        </form>
    </div>
</section>

</body>
</html>
