<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>Editar Adicional</title>
</head>
<body>

<section layout:fragment="content">
    <div class="container">
        <h1>Editar Adicional</h1>

        <form action="/admin/adicionais/atualizar" method="post">
            <input type="hidden" name="id" th:value="${adicional.id}" />

            <div>
                <label for="nome">Nome do Adicional:</label>
                <input type="text" id="nome" name="nome" th:value="${adicional.nome}" required>
            </div>
            <br>
            <div>
                <label for="preco">Preço:</label>
                <input type="number" id="preco" name="preco" th:value="${adicional.preco}" step="0.01" required>
            </div>
            <br>
            <button type="submit" class="btn-default">Salvar Alterações</button>
            <a th:href="@{/admin/dashboard_admin}">Cancelar</a>
        </form>
    </div>
</section>

</body>
</html>
