<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Login - StackBerry</title>
    <th:block layout:fragment="page-css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
              crossorigin="anonymous">

        <style>
            .form-container {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: calc(100vh - 180px);
                padding: 40px 20px;
            }

            .login-card {
                width: 100%;
                max-width: 440px;
                border-radius: var(--radius-xl);
                background: rgba(22, 4, 44, 0.85);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.12);
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
                color: #ffffff;
                padding: 40px 32px;
            }

            .login-card h2 {
                font-size: 1.8rem;
                font-weight: 700;
                margin-bottom: 6px;
                text-align: center;
                background: linear-gradient(135deg, #ffffff 40%, #c4b5fd 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .login-card p.subtitle {
                text-align: center;
                color: var(--text-subtle);
                font-size: 0.95rem;
                margin-bottom: 28px;
            }

            .form-label {
                font-weight: 500;
                font-size: 0.9rem;
                color: var(--text-muted);
                margin-bottom: 8px;
            }

            .form-control {
                background: rgba(255, 255, 255, 0.06);
                border: 1.5px solid rgba(255, 255, 255, 0.15);
                border-radius: var(--radius-md);
                color: #ffffff;
                padding: 12px 16px;
                font-size: 0.95rem;
                transition: var(--transition);
            }

            .form-control:focus {
                background: rgba(255, 255, 255, 0.1);
                border-color: var(--primary-berry);
                color: #ffffff;
                box-shadow: 0 0 15px var(--primary-berry-glow);
            }

            .form-control::placeholder {
                color: rgba(255, 255, 255, 0.35);
            }

            .btn-login-submit {
                width: 100%;
                padding: 14px;
                font-size: 1.05rem;
                margin-top: 10px;
                margin-bottom: 20px;
            }

            .form-footer {
                font-size: 0.92rem;
                text-align: center;
                color: var(--text-muted);
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                padding-top: 18px;
            }

            .form-footer a {
                color: #86efac;
                text-decoration: none;
                font-weight: 600;
            }

            .form-footer a:hover {
                text-decoration: underline;
            }
        </style>
    </th:block>
</head>

<body>

<main layout:fragment="content">
    <div class="form-container">
        <div class="login-card">
            <h2>Bem-vindo de volta!</h2>
            <p class="subtitle">Acesse sua conta para fazer seus pedidos</p>

            <!-- Mensagens -->
            <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                Usuário ou senha inválidos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                Você saiu com sucesso.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="username" name="username" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-default btn-login-submit">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar
                </button>
            </form>

            <div class="form-footer">
                <p class="mb-0">Ainda não tem conta? <a th:href="@{/cadastrar}">Cadastre-se</a></p>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="page-script">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
</th:block>

</body>
</html>
