<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Entrar na Conta - StackBerry</title>
    <th:block layout:fragment="page-css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
              crossorigin="anonymous">

        <style>
            .form-container {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: calc(100vh - 220px);
                padding: 40px 16px 80px 16px;
                background-color: var(--bg-main, #FAF6F0);
            }

            .login-card {
                width: 100%;
                max-width: 450px;
                border-radius: 28px;
                background: linear-gradient(165deg, #FCF8FA 0%, #F5ECF5 100%);
                border: 1.5px solid #E4D2E8;
                box-shadow: 0 20px 48px rgba(58, 11, 46, 0.09);
                padding: 44px 36px 36px 36px;
                text-align: center;
            }

            .login-logo-emblem {
                width: 68px;
                height: 68px;
                object-fit: contain;
                margin-bottom: 12px;
                filter: drop-shadow(0 4px 10px rgba(58, 11, 46, 0.12));
            }

            .login-card h2 {
                font-family: var(--font-heading, 'Outfit', sans-serif);
                font-size: 1.9rem;
                font-weight: 900;
                margin-bottom: 6px;
                color: var(--text-title, #26051E);
                letter-spacing: -0.5px;
            }

            .login-card p.subtitle {
                color: var(--text-muted, #7D6476);
                font-size: 0.95rem;
                margin-bottom: 26px;
                line-height: 1.45;
            }

            .form-group-wrap {
                text-align: left;
                margin-bottom: 18px;
            }

            .form-label {
                font-family: var(--font-heading, 'Outfit', sans-serif);
                font-weight: 700;
                font-size: 0.9rem;
                color: var(--text-title, #26051E);
                margin-bottom: 8px;
                display: block;
            }

            .form-control {
                background: #FFFFFF;
                border: 1.5px solid #DFCEE4;
                border-radius: 16px;
                color: var(--text-title, #26051E);
                padding: 13px 18px;
                font-size: 0.96rem;
                font-family: 'Poppins', sans-serif;
                transition: var(--transition, all 0.25s ease);
                width: 100%;
            }

            .form-control:focus {
                background: #FFFFFF;
                border-color: #26051E;
                color: var(--text-title, #26051E);
                box-shadow: 0 0 0 4px rgba(38, 5, 30, 0.1);
                outline: none;
            }

            .form-control::placeholder {
                color: #A993AD;
            }

            .btn-login-submit {
                background: #26051E !important;
                color: #FFFFFF !important;
                border: none !important;
                border-radius: 9999px !important;
                padding: 14px 28px !important;
                font-weight: 800 !important;
                font-size: 1.05rem !important;
                font-family: var(--font-heading, 'Outfit', sans-serif) !important;
                cursor: pointer !important;
                display: inline-flex !important;
                align-items: center !important;
                justify-content: center !important;
                gap: 10px !important;
                transition: all 0.25s ease !important;
                box-shadow: 0 8px 24px rgba(38, 5, 30, 0.28) !important;
                width: 100% !important;
                margin-top: 14px;
                margin-bottom: 22px;
                text-decoration: none !important;
            }

            .btn-login-submit:hover {
                background: #3A0B2E !important;
                transform: translateY(-2px) !important;
                box-shadow: 0 12px 30px rgba(38, 5, 30, 0.38) !important;
                color: #FFFFFF !important;
            }

            .form-footer {
                font-size: 0.92rem;
                text-align: center;
                color: var(--text-muted, #7D6476);
                border-top: 1.5px solid var(--border-light, #EFE4F2);
                padding-top: 20px;
                margin-top: 10px;
            }

            .form-footer a {
                color: var(--color-pink, #AD1457);
                text-decoration: none;
                font-weight: 700;
                transition: color 0.2s ease;
            }

            .form-footer a:hover {
                color: #26051E;
                text-decoration: underline;
            }

            .alert {
                border-radius: 16px;
                font-size: 0.9rem;
                padding: 12px 18px;
                border: 1.5px solid transparent;
                margin-bottom: 20px;
                text-align: left;
            }

            .alert-danger {
                background: #FEE2E2;
                border-color: #FCA5A5;
                color: #991B1B;
            }

            .alert-success {
                background: #DCFCE7;
                border-color: #86EFAC;
                color: #166534;
            }
        </style>
    </th:block>
</head>

<body>

<main layout:fragment="content">
    <div class="form-container">
        <div class="login-card">
            <img src="/images/StackBerry_OnlyLogo.png" alt="StackBerry Emblem" class="login-logo-emblem">
            <h2>Bem-vindo de volta!</h2>
            <p class="subtitle">Acesse sua conta para pedir seu açaí artesanal</p>

            <!-- Mensagens -->
            <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                Usuário ou senha inválidos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                Você saiu com sucesso da sua conta.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group-wrap">
                    <label for="username" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="username" name="username" placeholder="seuemail@exemplo.com" required autofocus>
                </div>

                <div class="form-group-wrap">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login-submit">
                    <span>Entrar na Conta</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="form-footer">
                <p class="mb-0">Ainda não tem conta? <a th:href="@{/cadastrar}">Cadastre-se aqui</a></p>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="page-script">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
</th:block>

</body>
</html>
