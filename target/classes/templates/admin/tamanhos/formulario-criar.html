<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
  <title>Adicionar Novo Tamanho</title>
  <th:block layout:fragment="page-css">
    <link rel="stylesheet" th:href="@{/styles/formulario.css}">
  </th:block>
</head>
<body>

<section layout:fragment="content">
  <div class="form-wrapper">
    <h1>Adicionar Novo Tamanho</h1>

    <form th:action="@{/admin/tamanhos/salvar}" method="post">
      <div class="form-group">
        <label for="nome">Nome do Tamanho:</label>
        <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex: Grande (500ml)" required>
      </div>

      <div class="form-group">
        <label for="preco">Preço:</label>
        <input type="number" class="form-control" id="preco" name="preco" step="0.01" placeholder="Ex: 12.50" required>
      </div>

      <div class="form-actions">
        <a th:href="@{/admin/dashboard_admin}" class="btn-cancel">Cancelar</a>
        <button type="submit" class="btn-default">Salvar Tamanho</button>
      </div>
    </form>
  </div>
</section>
</body>
</html>
