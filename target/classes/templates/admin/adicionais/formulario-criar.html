<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Novo Adicional</title>
    <th:block layout:fragment="page-css">
        <link rel="stylesheet" th:href="@{/styles/formulario.css}">
    </th:block>
</head>
<body>

<main layout:fragment="content">
    <div class="form-wrapper">
        <div class="form-wrapper-header">
            <h1><i class="fa-solid fa-seedling" style="margin-right: 8px; color: var(--color-green, #10B981);"></i> Adicionar Novo Adicional</h1>
            <a href="/admin/dashboard_admin" class="btn-modal-close" title="Fechar e voltar ao Painel" aria-label="Fechar">
                <i class="fa-solid fa-xmark"></i>
            </a>
        </div>

        <form th:action="@{/admin/adicionais/salvar}" method="post">
            <div class="form-group">
                <label for="nome">Nome do Adicional:</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex: Morango Fresco" required autofocus>
            </div>

            <div class="form-group">
                <label for="preco">Preço Adicional (R$):</label>
                <input type="number" class="form-control" id="preco" name="preco" step="0.01" min="0" placeholder="Ex: 3.50" required>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/dashboard_admin}" class="btn-cancel">
                    <i class="fa-solid fa-arrow-left" style="margin-right: 6px;"></i> Cancelar
                </a>
                <button type="submit" class="btn-default">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Adicional
                </button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
