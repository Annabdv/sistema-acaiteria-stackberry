<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Crie sua Conta - StackBerry</title>

    <th:block layout:fragment="page-css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
              crossorigin="anonymous">

        <style>
            .form-container {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: calc(100vh - 180px);
                padding: 40px 20px;
            }

            .signup-card {
                width: 100%;
                max-width: 480px;
                border-radius: var(--radius-xl);
                background: rgba(22, 4, 44, 0.85);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.12);
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
                color: #ffffff;
                padding: 40px 32px;
            }

            .signup-card h2 {
                font-size: 1.8rem;
                font-weight: 700;
                margin-bottom: 6px;
                text-align: center;
                background: linear-gradient(135deg, #ffffff 40%, #c4b5fd 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .signup-card p.subtitle {
                text-align: center;
                color: var(--text-subtle);
                font-size: 0.95rem;
                margin-bottom: 24px;
            }

            .form-label {
                font-weight: 500;
                font-size: 0.9rem;
                color: var(--text-muted);
                margin-bottom: 6px;
            }

            .form-control {
                background: rgba(255, 255, 255, 0.06);
                border: 1.5px solid rgba(255, 255, 255, 0.15);
                border-radius: var(--radius-md);
                color: #ffffff;
                padding: 12px 16px;
                font-size: 0.95rem;
                transition: var(--transition);
            }

            .form-control:focus {
                background: rgba(255, 255, 255, 0.1);
                border-color: var(--accent-green);
                color: #ffffff;
                box-shadow: 0 0 15px var(--accent-green-glow);
            }

            .form-control::placeholder {
                color: rgba(255, 255, 255, 0.35);
            }

            .btn-signup-submit {
                width: 100%;
                padding: 14px;
                font-size: 1.05rem;
                margin-top: 10px;
                margin-bottom: 16px;
            }

            .form-footer {
                font-size: 0.92rem;
                text-align: center;
                color: var(--text-muted);
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                padding-top: 18px;
            }

            .form-footer a {
                color: #86efac;
                text-decoration: none;
                font-weight: 600;
            }

            .form-footer a:hover {
                text-decoration: underline;
            }
        </style>
    </th:block>
</head>

<body>

<main layout:fragment="content">
    <div class="form-container">
        <div class="signup-card">
            <h2>Crie sua Conta</h2>
            <p class="subtitle">Cadastre-se para pedir seu açaí em poucos segundos</p>

            <div th:if="${erro}" class="alert alert-danger" role="alert">
                <p th:text="${erro}" class="mb-0"></p>
            </div>

            <form th:action="@{/usuarios/cadastrar}" method="post" id="cadastroForm">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Endereço de E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" placeholder="••••••••" required>
                </div>

                <div class="mb-4">
                    <label for="confirmarSenha" class="form-label">Confirmar Senha</label>
                    <input type="password" class="form-control" id="confirmarSenha" name="confirmarSenha" placeholder="••••••••" required>
                    <div class="invalid-feedback" id="senhaError">
                        As senhas não coincidem.
                    </div>
                </div>

                <button type="submit" class="btn-default btn-signup-submit">
                    <i class="fa-solid fa-user-plus"></i> Finalizar Cadastro
                </button>
            </form>

            <div class="form-footer">
                <p class="mb-0">Já tem uma conta? <a th:href="@{/login}">Faça login</a></p>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="page-script">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>

    <script>
        const form = document.getElementById('cadastroForm');
        const senha = document.getElementById('senha');
        const confirmarSenha = document.getElementById('confirmarSenha');

        form.addEventListener('submit', function (event) {
            senha.classList.remove('is-invalid');
            confirmarSenha.classList.remove('is-invalid');

            if (senha.value !== confirmarSenha.value) {
                event.preventDefault();
                senha.classList.add('is-invalid');
                confirmarSenha.classList.add('is-invalid');
            }
        });
    </script>
</th:block>

</body>
</html>
