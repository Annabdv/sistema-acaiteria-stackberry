<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Cardápio - Açaí</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous"/>
    <style>
        body {
            background-color: rebeccapurple;
            color: white;
        }
        .btn-purple {
            background-color: white;
            color: rebeccapurple;
            border: none;
            transition: background-color 0.3s;
        }
        .btn-purple:hover {
            background-color: #f0f0f0;
            color: rebeccapurple;
        }
        .card-container {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .form-check-label {
            cursor: pointer;
        }
        .container {
            margin-bottom: 100px;
        }
    </style>
</head>
<body>
<main layout:fragment="content">
    <div class="container py-5">
        <div class="card-container mx-auto" style="max-width: 800px;">
            <h2 class="mb-4 text-center">Cardápio de Açaí</h2>

            <form th:action="@{/carrinho/adicionar}" method="post" class="mx-auto" style="max-width: 700px;">
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="tamanho" class="form-label">Selecione o Tamanho</label>
                        <select name="tamanhoId" id="tamanho" class="form-select" required>
                            <option value="" disabled selected>Escolha um tamanho</option>
                            <option th:each="t : ${tamanhos}"
                                    th:value="${t.id}"
                                    th:text="${t.nome + ' - ' + #numbers.formatCurrency(t.preco)}">
                                Médio - R$ 0,00
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Adicionais</label>
                        <div class="form-check" th:each="adicional : ${adicionais}">
                            <input class="form-check-input" type="checkbox"
                                   th:value="${adicional.id}"
                                   th:id="${'adicional-' + adicional.id}"
                                   name="adicionaisIds">
                            <label class="form-check-label" th:for="${'adicional-' + adicional.id}"
                                   th:text="${adicional.nome + ' (' + #numbers.formatCurrency(adicional.preco) + ')'}">
                            </label>
                        </div>
                    </div>
                </div>

                <div class="d-flex align-items-center mb-3">
                    <div class="me-3" style="width: 120px;">
                        <label for="quantidade" class="form-label">Quantidade</label>
                        <input type="number" min="1" value="1" name="quantidade" id="quantidade" class="form-control" required/>
                    </div>
                    <button type="submit" class="btn btn-purple mt-auto flex-grow-1">Adicionar ao Carrinho</button>
                </div>
            </form>

            <div class="mt-4 text-center">
                <a href="/carrinho" class="btn btn-outline-light">Ver Carrinho</a>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
