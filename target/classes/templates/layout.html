<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">StackBerry</title>

    <link rel="stylesheet" th:href="@{/styles/styles.css}">
    <link rel="stylesheet" th:href="@{/styles/header.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/site.webmanifest}">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
    <link rel="stylesheet" th:href="@{/styles/header.css}">
    <th:block layout:fragment="page-css"></th:block>

</head>
<body>

<header>
    <nav id="navbar">
        <img src="/images/StackBerry_Text.png" alt="stackberry logo">
        <ul id="nav_list">
            <li class="nav-item active"><a href="/">Início</a></li>
            <li class="nav-item"><a href="/cardapio">Cardápio</a></li>

            <li class="nav-item" th:if="${usuario != null and usuario.tipoDeUsuario.name() == 'ADMINISTRADOR'}">
                <a th:href="@{/admin/dashboard_admin}">Dashboard</a>
            </li>

            <li class="nav-item" th:if="${usuario != null and usuario.tipoDeUsuario.name() == 'CLIENTE'}">
                <a th:href="@{/meus-pedidos}">Meus Pedidos</a>
            </li>

            <li class="nav-item" th:if="${usuario == null}">
                <a th:href="@{/cadastrar}">Cadastre-se</a>
            </li>
        </ul>

        <div class="navbar-buttons">
            <button class="btn-default" th:if="${usuario != null}" onclick="window.location.href='/carrinho'">
                <i class="fa-solid fa-cart-shopping"></i> Carrinho
            </button>

            <button class="btn-default" th:if="${usuario != null}" onclick="window.location.href='/logout'">Sair</button>

            <button class="btn-default" th:if="${usuario == null}" onclick="window.location.href='/login'">Fazer login</button>
        </div>

        <button id="mobile_btn"><i class="fa-solid fa-bars"></i></button>
    </nav>
    <div id="mobile_menu">
        <ul id="mobile_nav_list">
            <li class="nav-item"><a href="/">Inicio</a></li>
            <li class="nav-item"><a href="/cardapio">Cardápio</a></li>

            <li class="nav-item" th:if="${usuario != null and usuario.tipoDeUsuario.name() == 'ADMINISTRADOR'}">
                <a th:href="@{/admin/dashboard_admin}">Dashboard</a>
            </li>

            <li class="nav-item" th:if="${usuario != null and usuario.tipoDeUsuario.name() == 'CLIENTE'}">
                <a th:href="@{/meus-pedidos}">Meus Pedidos</a>
            </li>

            <li class="nav-item" th:if="${usuario == null}">
                <a th:href="@{/cadastrar}">Cadastre-se</a>
            </li>
        </ul>

        <div class="navbar-buttons">
            <button class="btn-default" th:if="${usuario != null}" onclick="window.location.href='/carrinho'">
                <i class="fa-solid fa-cart-shopping"></i> Carrinho
            </button>

            <button class="btn-default" th:if="${usuario != null}" onclick="window.location.href='/logout'">Sair</button>

            <button class="btn-default" th:if="${usuario == null}" onclick="window.location.href='/login'">Fazer login</button>
        </div>
    </div>
</header>

<main layout:fragment="content"></main>

<footer id="footer">
    <p>Desenvolvido por StackBerry &copy; 2025</p>
</footer>

<th:block layout:fragment="page-script"></th:block>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://unpkg.com/scrollreveal"></script>
<script src="/js/script.js"></script>
</body>
</html>
