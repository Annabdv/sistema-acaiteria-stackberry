<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Erro interno</title>
    <th:block layout:fragment="page-css">
        <style>
            .error-container {
                padding-top: 50px;
                padding-bottom: 50px;
            }
        </style>
    </th:block>
</head>
<body>
<main layout:fragment="content">
    <div class="container text-center error-container">
        <div class="row align-items-center mt-5">
            <div class="col-md-6">
                <img th:src="@{/images/gato.gif}" alt="Gato triste" class="img-fluid">
            </div>
            <div class="col-md-6 d-flex align-items-start flex-column">
                <h1>Alguma coisa de errado aconteceu no sistema.</h1>
                <h2>Desculpe-nos o transtorno.</h2>
            </div>
        </div>
    </div>
</main>
</body>
</html>
